# Defaults shared by every generation run (configs/runs/*.yaml override these).
datasets: [triviaqa, popqa, gsm8k]
k: 8                  # sampled completions per question
temperature: 0.6
top_p: 0.95
greedy: true          # plus one greedy (temperature 0) completion per question
max_tokens:
  direct: 128         # direct answers are short; hitting this is logged as truncation
  think: 4096
seed: 20261119        # per-request seeds are derived from (seed, qid), so results
                      # don't depend on batching or on resuming
out_dir: results/raw
chunk_size: 250       # questions per generate() call; output is flushed per chunk

vllm:
  dtype: bfloat16
  max_model_len: 6144 # longest prompt (~600 tokens) + 4096 thinking tokens, with margin
  gpu_memory_utilization: 0.90
  tensor_parallel_size: 1
  enable_prefix_caching: true   # the few-shot block is a shared prefix
