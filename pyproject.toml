[project]
name = "think-failures"
version = "0.2.0"
description = "When thinking hurts: finding, explaining and preventing reasoning-induced failures in LLMs"
requires-python = ">=3.12"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
